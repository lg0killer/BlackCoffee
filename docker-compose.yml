
services:
  web:
    build: .
    command: ./entrypoint.sh python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - valkey
      - db
    environment:
      - CELERY_BROKER_URL=redis://valkey:6379/0

  worker:
    build: .
    command: celery -A blackcoffee worker -l info
    volumes:
      - .:/app
    depends_on:
      - valkey
      - db
      - web
    environment:
      - CELERY_BROKER_URL=redis://valkey:6379/0

  beat:
    build: .
    command: celery -A blackcoffee beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    depends_on:
      - valkey
      - db
      - web
    environment:
      - CELERY_BROKER_URL=redis://valkey:6379/0

  valkey:
    image: valkey/valkey:7.2
    ports:
      - "6379:6379"

  db:
    # We are using sqlite which is a file in the workspace,
    # but a dummy service can be kept here if you switch to Postgres.
    # For now, it's just an empty anchor so depends_on doesn't fail.
    image: busybox
    command: sleep infinity
