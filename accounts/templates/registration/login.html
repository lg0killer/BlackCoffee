{% extends "base/base.html" %}

{% block title %}Login - BlackCoffee{% endblock %}
{% block header_subtitle %}Sign In to Your Account{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign In</button>
    </form>
    <p style="text-align:center; margin-top:15px;">Don't have an account? <a href="{% url 'signup' %}" style="color:inherit;">Sign up</a></p>
</div>
{% endblock %}
