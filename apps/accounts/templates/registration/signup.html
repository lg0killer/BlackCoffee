{% extends "base/base.html" %}

{% block title %}Sign Up - BlackCoffee{% endblock %}
{% block header_subtitle %}Create an Account{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Sign Up</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign Up</button>
    </form>
    <p style="text-align:center; margin-top:15px;">Already have an account? <a href="{% url 'login' %}" style="color:inherit;">Login</a></p>
</div>
{% endblock %}
